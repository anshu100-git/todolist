<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Todo List UI</title>
  <!-- <link rel="stylesheet" href="style.css" /> -->
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  :root {
    --primary-color: #2563eb;
    --destructive-color: #e11d48;
    --card-color: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.1)
  }

  body {
    min-height: 100vh;
    background-color: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url(ChatGPT\ Image\ Jan\ 16\,\ 2026\,\ 01_29_40\ PM.png);
  }

  .todo-container {
    width: 100%;
    max-width: 400px;
    background-color: var(--card-color);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 10px 20px var(--card-shadow);
  }

  .title {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }

  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .todo-input {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    outline: none;
  }

  .todo-input:focus {
    border-color: var(--primary-color);
  }

  .actionconatiner {
    display: flex;
    gap: 5px;
  }

  .add-btn,
  .update-btn {
    padding: 10px 16px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .update-btn {
    background-color: green;
  }

  .remove-btn {
    display: none;
  }

  .add-btn:hover,
  .update-btn:hover {
    background-color: var(--primary-color);
  }

  .todo-list {
    list-style: none;
  }

  .todo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #f9f9f9;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .delete-btn,
  .edit-btn {
    background: none;
    border: none;
    color: var(--destructive-color);
    font-size: 18px;
    cursor: pointer;
  }

  .delete-btn:hover {
    color: var(--destructive-color);
  }
</style>

<body>
  <div class="todo-container">
    <h1 class="title">Todo List</h1>

    <!-- create field  -->
    <div class="input-group">
      <input type="text" placeholder="Add a new task..." class="todo-input" />
      <button class="add-btn">Add</button>
      <button class="update-btn remove-btn">update</button>
    </div>

    <!-- todo list -->
    <ul class="todo-list">
      <!-- <li class="todo-item">
          <div class="left">
            <input type="checkbox" />
            <span>Wakeup </span>
          </div>
          <button class="delete-btn">❌</button>
        </li> -->
    </ul>
  </div>

  <script src="todolistnew.js"></script>
</body>

</html>
